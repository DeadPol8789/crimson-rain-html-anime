    <script>
      const tl = gsap.timeline({ paused: true });

      // A drawing swap lands on a frame boundary. The 1ms lead keeps a seek to
      // exactly that frame from missing the set on float rounding.
      const at = (frame) => frame / 24 - 0.001;
      const swap = (out, next, frame) => {
        tl.set(out, { opacity: 0 }, at(frame));
        tl.set(next, { opacity: 1 }, at(frame));
      };
      // Whole loops that end exactly on the clip's last moment, near ~0.25s and far ~0.4s each.
      const rain = (id, start, length) => {
        const near = Math.round(length / 0.25);
        const far = Math.round(length / 0.4);
        tl.to(`#${id}n`, { x: -80, y: 560, duration: length / near, ease: "none", repeat: near - 1 }, start);
        tl.to(`#${id}f`, { x: -80, y: 560, duration: length / far, ease: "none", repeat: far - 1 }, start);
      };

      // 1 · Establish: the only camera move
      tl.to("#cam1", { scale: 1.06, duration: 2.4, ease: "power1.inOut" }, 0);
      rain("rain1", 0, 2.4);
      swap("#e1", "#e2", 24);
      swap("#e2", "#e3", 40);
      swap("#e-arm-rest", "#e-arm-hilt", 40);

      // cut 1: accent dip straddles 2.40
      tl.to("#dip-a", { opacity: 1, duration: 0.25, ease: "power2.in" }, 2.15);
      tl.to("#dip-a", { opacity: 0, duration: 0.35, ease: "power2.out" }, 2.45);

      // 2 · Sakuga: locked camera, 8 drawings
      rain("rain2", 2.15, 3.85);
      swap("#d1", "#d2", 96);
      swap("#d2", "#d3", 100);
      swap("#d3", "#d4", 102);
      swap("#d4", "#d5", 103);
      swap("#d5", "#d6", 104);
      swap("#d6", "#d7", 106);
      swap("#d7", "#d8", 114);
      tl.set("#speed", { opacity: 1 }, at(102));
      tl.set("#speed", { opacity: 0 }, at(106));
      tl.set("#trail", { opacity: 0.45 }, at(103));
      tl.set("#trail", { opacity: 0 }, at(106));

      // cut 2: ink dip straddles 6.00
      tl.to("#dip-b", { opacity: 1, duration: 0.25, ease: "power2.in" }, 5.75);
      tl.to("#dip-b", { opacity: 0, duration: 0.35, ease: "power2.out" }, 6.05);

      // 3 · Button: blink, settle, hold, last 8 frames to ink
      rain("rain3", 5.75, 2.25);
      swap("#b1", "#b2", 164);
      swap("#b2", "#b3", 166);
      tl.to("#fade", { opacity: 1, duration: 7 / 24, ease: "power1.in" }, 184 / 24);

      window.__timelines = window.__timelines || {};
      window.__timelines["film"] = tl;
    </script>
